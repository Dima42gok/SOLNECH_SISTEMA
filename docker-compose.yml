services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/accessevent
      - SECRET_KEY=your-secret-key-change-me-in-production-0123456789
      - FLASK_DEBUG=0
      # В Docker не уходим молча на SQLite: ждём базу и падаем, если её нет
      - DB_STRICT=1
      - DB_CONNECT_RETRIES=20
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=accessevent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accessevent"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
