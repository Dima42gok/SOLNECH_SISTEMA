name: Day3 Backend Check
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check project structure
        run: |
          test -f app.py
          test -f config.py
          test -f models.py
          test -f routes/auth.py
          test -f routes/events.py
          test -f routes/registrations.py
          test -f utils/auth_helpers.py
          test -f utils/accessibility.py
      - name: Check security helpers
        run: |
          grep -q "hash_password" utils/auth_helpers.py && echo "PASS: hash_password" || { echo "FAIL: hash_password"; exit 1; }
          grep -q "generate_token" utils/auth_helpers.py && echo "PASS: jwt" || { echo "FAIL: jwt"; exit 1; }
          grep -q "role_required" utils/auth_helpers.py && echo "PASS: roles" || { echo "FAIL: roles"; exit 1; }
      - name: Check accessibility
        run: |
          grep -q "accessibility" utils/accessibility.py && echo "PASS: accessibility" || { echo "FAIL: accessibility"; exit 1; }
      - name: Syntax check
        run: python -m py_compile app.py config.py models.py routes/*.py utils/*.py
      - name: Import check
        run: |
          python -c "import app; print('PASS - app imports and tables are created')"
      - name: Done
        run: |
          echo "PASS: Day3 Backend Check completed"
